name: Deploy PROCOACH to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "procoach/**"
      - ".github/workflows/deploy-procoach-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PROCOACH site
        uses: actions/upload-pages-artifact@v4
        with:
          path: procoach

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
